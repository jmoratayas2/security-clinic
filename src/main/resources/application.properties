spring.application.name=security-service
server.port=${PORT:8081}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

security.jwt.issuer=clinicas-security
security.jwt.audience=clinicas-backend
security.jwt.expiration-seconds=3600
security.jwt.private-key=classpath:keys/private.pem
security.jwt.public-key=classpath:keys/public.pem
security.jwt.generate-test-keys=false

security.bootstrap.enabled=${SECURITY_BOOTSTRAP_ENABLED:true}
security.cors.allowed-origins=${SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,https://clinica-frontend-7kh5.onrender.com}
spring.jpa.open-in-view=false

# Control de Solicitudes (Rate Limiting: 10 peticiones/minuto)
security.ratelimit.requests-per-minute=${SECURITY_RATELIMIT_RPM:10}

# Intentos fallidos y Bloqueo temporal (5 intentos fallidos -> 15 min de bloqueo)
security.login.max-failed-attempts=${SECURITY_LOGIN_MAX_FAILED_ATTEMPTS:5}
security.login.lock-duration-minutes=${SECURITY_LOGIN_LOCK_MINUTES:15}

# Cloudflare Turnstile / CAPTCHA (Secret Key oficial de Cloudflare configurada)
security.turnstile.secret-key=${TURNSTILE_SECRET_KEY:0x4AAAAAAFuNCyV4p4xhgTmAe0_sC0VP59k}
security.turnstile.enabled=${TURNSTILE_ENABLED:true}
