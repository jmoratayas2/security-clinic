spring.application.name=security-service
server.port=8081

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

security.jwt.issuer=clinicas-security
security.jwt.audience=clinicas-backend
security.jwt.expiration-seconds=3600
security.jwt.private-key=classpath:keys/private.pem
security.jwt.public-key=classpath:keys/public.pem
security.jwt.generate-test-keys=false

security.bootstrap.enabled=${SECURITY_BOOTSTRAP_ENABLED:true}
security.cors.allowed-origins=${SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
spring.jpa.open-in-view=false
