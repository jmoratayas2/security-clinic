spring.datasource.url=jdbc:h2:mem:security_service_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

security.bootstrap.enabled=true
security.jwt.generate-test-keys=true
security.jwt.issuer=clinicas-security
security.jwt.audience=clinicas-backend
security.jwt.expiration-seconds=3600
